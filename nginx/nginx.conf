# /opt/matrix/nginx/nginx.conf

# Matrix Client API + Element Web (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name hq.gkfs.com.ua;

    ssl_certificate     /etc/letsencrypt/live/hq.gkfs.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hq.gkfs.com.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Matrix Client API + Federation + Admin API
    location ~ ^(/_matrix|/_synapse) {
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 50M;
        proxy_read_timeout 600;
    }

    # Well-known dla federation delegation
    location /.well-known/matrix/server {
        return 200 '{"m.server":"hq.gkfs.com.ua:443"}';
        add_header Content-Type application/json;
    }

    location /.well-known/matrix/client {
        return 200 '{"m.homeserver": {"base_url": "https://hq.gkfs.com.ua"}}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Synapse Admin
    location /admin/ {
        proxy_pass http://synapse-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Element Call (self-hosted)
    location /call/ {
        proxy_pass http://element-call:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # lk-jwt-service (LiveKit token endpoint)
    location /_livekit/jwt/ {
        proxy_pass http://lk-jwt-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # LiveKit WebSocket
    location /livekit {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600;
    }

    # Element Web
    location / {
        proxy_pass http://element:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Federation fallback - port 8448
server {
    listen 8448 ssl;
    http2 on;
    server_name hq.gkfs.com.ua;

    ssl_certificate     /etc/letsencrypt/live/hq.gkfs.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hq.gkfs.com.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://synapse:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name hq.gkfs.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
